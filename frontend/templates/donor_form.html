{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Net | Add Donor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'frontend/styles.css' %}">
</head>
<body class="bg-light text-body">
    {% include "navbar.html" %}
    <div class="container py-5">
        <div class="d-flex flex-column flex-md-row align-items-start align-items-md-center justify-content-between gap-4 mb-5">
            <div>
                <span class="badge rounded-pill bg-primary bg-opacity-10 text-primary mb-3">Blood Net</span>
                <h1 class="display-6 fw-bold mb-2">{{page_titel}}</h1>
                <p class="text-secondary mb-0">{{subtitle}}</p>
            </div>
            <a href="/donor/view/" class="btn btn-outline-primary btn-lg">View donors</a>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-4 p-lg-5">
                <form method="POST" novalidate>
                    {% csrf_token %}
                    <div class="mb-4">
                        {{ donor_form.non_field_errors }}
                        {{ donor_form.as_p }}
                    </div>
                    <div class="d-flex justify-content-end mt-4">
                        <button type="submit" class="btn btn-primary btn-lg">{{button_text}}</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
