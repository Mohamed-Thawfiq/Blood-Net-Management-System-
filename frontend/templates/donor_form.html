{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Net | {{ page_title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'frontend/styles.css' %}">
</head>
<body>
<div class="app-layout">
    {% include "sidebar.html" %}
    <div class="main-content">
        <div class="page-header">
            <div>
                <h1>{{ page_title }}</h1>
                <p>{{ subtitle }}</p>
            </div>
            <a href="/donor/view/" class="btn btn-outline-secondary">← Back to Donors</a>
        </div>
        <div class="form-card">
            <form method="POST">
                {% csrf_token %}
                {{ donor_form.non_field_errors }}
                {{ donor_form.as_p }}
                <div class="d-flex justify-content-end mt-4">
                    <button type="submit" class="btn btn-red btn-lg px-5">{{ button_text }}</button>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
