{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Net | Send Blood Request</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'frontend/styles.css' %}">
</head>
<body>
<div class="app-layout">
    {% include "sidebar.html" %}
    <div class="main-content">
        <div class="page-header">
            <div>
                <h1>Send Blood Request</h1>
                <p>Submit a blood request to a manager or another area manager</p>
            </div>
            <a href="/donor/bloodreq/" class="btn btn-outline-secondary">← Back</a>
        </div>

        <div class="form-card" style="max-width:620px">
            <form method="POST" action="/donor/addrequest/">
                {% csrf_token %}

                <h3 style="font-size:14px;font-weight:600;margin-bottom:16px;color:#C0392B">
                    🩸 Patient Details
                </h3>

                <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
                    <div class="mb-3">
                        <label class="form-label">Patient Name <span style="color:#C0392B">*</span></label>
                        <input type="text" name="patient_name" class="form-control"
                            placeholder="Full name of patient" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Patient Age <span style="color:#C0392B">*</span></label>
                        <input type="number" name="patient_age" class="form-control"
                            placeholder="Age" min="1" max="120" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contact Number <span style="color:#C0392B">*</span></label>
                        <input type="tel" name="patient_contact" class="form-control"
                            placeholder="Patient contact number" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Blood Group <span style="color:#C0392B">*</span></label>
                        <select name="patient_bg" class="form-select" required>
                            <option value="">Select blood group</option>
                            <option>A+</option><option>A-</option>
                            <option>B+</option><option>B-</option>
                            <option>AB+</option><option>AB-</option>
                            <option>O+</option><option>O-</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Hospital Name <span style="color:#C0392B">*</span></label>
                        <input type="text" name="hospital_name" class="form-control"
                            placeholder="Hospital name" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Hospital Area <span style="color:#C0392B">*</span></label>
                        <input type="text" name="hospital_area" class="form-control"
                            placeholder="Area/location of hospital" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Blood Units Required <span style="color:#C0392B">*</span></label>
                        <input type="number" name="blood_units" class="form-control"
                            placeholder="Number of units" min="1" value="1" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Last Date <span style="color:#C0392B">*</span></label>
                        <input type="date" name="last_date" class="form-control" required>
                    </div>
                </div>

                <hr style="border-color:#E8EAF0;margin:20px 0">

                <h3 style="font-size:14px;font-weight:600;margin-bottom:16px;color:#C0392B">
                    📤 Send Request To
                </h3>

                <div class="mb-3">
                    <label class="form-label">Recipient Type <span style="color:#C0392B">*</span></label>
                    <select class="form-select" id="recipientType" onchange="updateRecipients()">
                        <option value="">— Choose who to send this request to —</option>
                        <option value="manager">👤 Manager</option>
                        <option value="area_manager">🗺️ Area Manager</option>
                    </select>
                </div>

                <div class="mb-3" id="recipientSelect" style="display:none">
                    <label class="form-label">Select Recipient <span style="color:#C0392B">*</span></label>
                    <select class="form-select" name="recipient_id" id="recipientDropdown">
                        <option value="">Select recipient type first</option>
                    </select>
                    <input type="hidden" name="recipient_type" id="recipientTypeHidden">
                    <div id="recipientInfo" style="margin-top:8px;padding:10px 14px;background:#F7F8FC;border:1px solid #E8EAF0;border-radius:8px;font-size:12px;color:#6b7280;display:none">
                    </div>
                </div>

                <button type="submit" class="btn btn-red btn-lg px-5 mt-2">
                    Send Request
                </button>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
const managers = [
    {% for m in managers %}
    {id: {{ m.id }}, name: "{{ m.username }}", area: "Manager", role: "Manager"},
    {% endfor %}
];

const areaManagers = [
    {% for am in area_managers %}
    {id: {{ am.id }}, name: "{{ am.username }}", area: "{{ am.area }}", role: "Area Manager"},
    {% endfor %}
];

function updateRecipients() {
    const type = document.getElementById('recipientType').value;
    const dropdown = document.getElementById('recipientDropdown');
    const section = document.getElementById('recipientSelect');
    const hiddenInput = document.getElementById('recipientTypeHidden');
    const infoBox = document.getElementById('recipientInfo');

    dropdown.innerHTML = '<option value="">— Select a recipient —</option>';
    hiddenInput.value = type;
    infoBox.style.display = 'none';

    if (!type) {
        section.style.display = 'none';
        return;
    }

    section.style.display = 'block';
    const list = type === 'manager' ? managers : areaManagers;

    if (list.length === 0) {
        dropdown.innerHTML = '<option value="">No recipients available</option>';
        return;
    }

    list.forEach(r => {
        const opt = document.createElement('option');
        opt.value = r.id;
        opt.textContent = type === 'manager'
            ? `${r.name} — Manager`
            : `${r.name} — ${r.area} (Area Manager)`;
        dropdown.appendChild(opt);
    });
}

// Show info card when recipient is selected
document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('recipientDropdown').addEventListener('change', function() {
        const type = document.getElementById('recipientType').value;
        const selectedId = parseInt(this.value);
        const infoBox = document.getElementById('recipientInfo');

        if (!selectedId) { infoBox.style.display = 'none'; return; }

        const list = type === 'manager' ? managers : areaManagers;
        const recipient = list.find(r => r.id === selectedId);

        if (recipient) {
            infoBox.style.display = 'block';
            infoBox.innerHTML = `
                <strong>Sending to:</strong> ${recipient.name}<br>
                <strong>Role:</strong> ${recipient.role}<br>
                <strong>Area:</strong> ${recipient.area}
            `;
        }
    });
});
</script>
</body>
</html>
